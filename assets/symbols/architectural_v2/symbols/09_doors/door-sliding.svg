<title id="door-sliding--title">Door · opaque sliding</title>
<desc id="door-sliding--desc">Original orthographic plan of two opaque bypass sliding leaves with overlapping solid cores, recessed pulls and parallel tracks. Nominal footprint 1920 by 200 millimetres. Clear opening 1800 millimetres. Front is +Y. Transparent background.</desc>
