<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="230" viewBox="-40 -40 1080 230" role="img" aria-labelledby="window-double-hung--title window-double-hung--desc" data-vertex-style="white-outline-2">
<title id="window-double-hung--title">Window · double-hung</title>
<desc id="window-double-hung--desc">Original orthographic plan section. Nominal design footprint 1000 by 150 millimetres. Two independent full-width vertical sashes occupy separate tracks at different frame depths; their meeting-rail profiles are shown in section, not as side-by-side panes. Transparent background. Conceptual design only; not certified for construction.</desc>
