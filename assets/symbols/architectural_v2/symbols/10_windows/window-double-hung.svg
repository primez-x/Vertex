<linearGradient id="window-double-hung--glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity="0.92"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.72"/><stop offset="1" stop-color="#f1f1f1" stop-opacity="0.88"/></linearGradient>
</defs>
