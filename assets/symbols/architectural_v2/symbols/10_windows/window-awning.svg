<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="230" viewBox="-40 -40 1080 230" role="img" aria-labelledby="window-awning--title window-awning--desc" data-vertex-style="white-outline-2">
<title id="window-awning--title">Window · awning (top-hinged)</title>
<desc id="window-awning--desc">Original shaded orthographic plan. Nominal design footprint 1000 by 150 millimetres. The vertical awning sash is closed; fine dashed straight guides show outward travel from the +Y side. Transparent background. Conceptual design only; not certified for construction.</desc>
