<linearGradient id="window-awning--glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity="0.92"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.72"/><stop offset="1" stop-color="#f1f1f1" stop-opacity="0.88"/></linearGradient>
<marker id="window-awning--travel-arrow" viewBox="0 0 6 6" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#777777" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
