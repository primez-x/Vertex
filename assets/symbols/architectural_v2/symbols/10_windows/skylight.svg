<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="1332" viewBox="-66 -66 1032 1332" role="img" aria-labelledby="skylight--title skylight--desc" data-vertex-style="white-outline-2">
<title id="skylight--title">Skylight</title>
<desc id="skylight--desc">Original shaded orthographic top view. Nominal footprint 900 by 1200 millimetres. Front is +Y. Transparent background. No clearance or construction certification.</desc>
<defs>
<linearGradient id="skylight--ceramic" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#ffffff" /><stop offset="0.5" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--rim" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#ffffff" /><stop offset="0.35" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<radialGradient id="skylight--well" cx="0.52" cy="0.65" r="0.67"><stop stop-color="#ffffff" /><stop offset="0.67" stop-color="#ffffff" /><stop offset="0.88" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></radialGradient>
<linearGradient id="skylight--steel" x1="0" y1="0" x2="1" y2="0.85"><stop stop-color="#ffffff" /><stop offset="0.24" stop-color="#ffffff" /><stop offset="0.49" stop-color="#ffffff" /><stop offset="0.73" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--steelwell" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#ffffff" /><stop offset="0.18" stop-color="#ffffff" /><stop offset="0.56" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--upholstery" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#ffffff" /><stop offset="0.45" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--cushion" x1="0" y1="0" x2="0.85" y2="1"><stop stop-color="#ffffff" /><stop offset="0.4" stop-color="#ffffff" /><stop offset="0.78" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--linen" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#ffffff" /><stop offset="0.4" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--wood" x1="0" y1="0" x2="0.35" y2="1"><stop stop-color="#ffffff" /><stop offset="0.5" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--counter" x1="0" y1="0" x2="0.6" y2="1"><stop stop-color="#ffffff" /><stop offset="0.5" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--dark" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#333333" /><stop offset="0.5" stop-color="#333333" /><stop offset="1" stop-color="#333333" /></linearGradient>
<linearGradient id="skylight--glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity="0.84" /><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.60" /><stop offset="1" stop-color="#f2f2f2" stop-opacity="0.78" /></linearGradient>
<radialGradient id="skylight--foliage" cx="0.38" cy="0.30" r="0.75"><stop stop-color="#ffffff" /><stop offset="0.55" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></radialGradient>
<linearGradient id="skylight--leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" /><stop offset="0.5" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
<linearGradient id="skylight--tread" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" /><stop offset="0.78" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f2f2" /></linearGradient>
