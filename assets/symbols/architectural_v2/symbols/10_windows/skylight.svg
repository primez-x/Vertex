<g id="skylight--artwork"><rect x="0" y="0" width="900" height="1200" rx="4" fill="url(#skylight--steel)" stroke="#111111" stroke-width="10" /><rect x="35" y="35" width="830" height="1130" rx="0" fill="url(#skylight--glass)" stroke="#111111" stroke-width="10" /><path d="M50,50 L630,50 L50,840 Z" fill="#ffffff" stroke="none" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" opacity=".16" /><path d="M450,35 L450,1165" fill="none" stroke="#111111" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" /></g>
